[package]
name = "skip-dat"
version = "1.5.2"
description = "Skip Dat: a liquid glass music wheel for Windows. Hold Alt and scroll anywhere."
edition = "2021"
rust-version = "1.90"

[lib]
name = "skip_dat_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
# custom-protocol embeds the ui folder, so a plain `cargo build --release` gives a finished app
tauri = { version = "2.12", features = ["tray-icon", "custom-protocol"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.2"
open = "5"
tiny_http = "0.12"

[target.'cfg(windows)'.dependencies]
windows-future = "0.3"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_System_WinRT",
  "Win32_System_Registry",
  "Win32_UI_HiDpi",
  "Media_Control",
  "Foundation",
  "Foundation_Collections",
  "Storage_Streams",
  "Win32_Media_Audio",
  "Win32_System_Com",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_System_Threading",
  "Win32_Storage_Packaging_Appx",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
