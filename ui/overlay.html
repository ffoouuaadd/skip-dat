<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skip Dat</title>
<style>
  :root {
    --ink: #FAFBFD;
    --ink-soft: rgba(250, 251, 253, .76);
    --font: "Segoe UI Variable Display", "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    /* a skin sets these (overlay.js) */
    --title-size: 21px; --artist-size: 15px; --title-weight: 650; --glow: rgba(0, 0, 0, .3); --case: none;
    --btn-ink: var(--ink); --chip-ink: var(--ink); --chip-on-ink: var(--ink);
    color-scheme: dark;
  }
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  body { font-family: var(--font); color: var(--ink); -webkit-user-select: none; user-select: none; cursor: default; }
  #gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #ui { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .t { position: absolute; left: 0; top: 0; margin: 0; transform-origin: 0 0; white-space: nowrap; visibility: hidden;
       text-shadow: var(--text-shadow, 0 1px 2px var(--glow)); max-width: 236px; overflow: hidden; text-overflow: ellipsis; text-transform: var(--case); }
  .t-title { font-weight: var(--title-weight); font-size: var(--title-size); line-height: 1.15; letter-spacing: -.005em; }
  .t-artist { font-weight: 400; font-size: var(--artist-size); line-height: 1.2; color: var(--ink-soft); }
  /* compact style: one small line each */
  body.compact .t { max-width: 200px; }
  body.compact .t-title { font-size: calc(var(--title-size) * .72); }
  body.compact .t-artist { font-size: calc(var(--artist-size) * .78); }
  .eq { position: absolute; left: 0; top: 0; display: flex; align-items: center; gap: 3px; height: 22px; transform-origin: 0 0; opacity: 0; }
  .eq i { display: block; width: 4px; border-radius: 2px; background: var(--ink); }
  /* the rail beside the wheel */
  .chip { position: absolute; left: 0; top: 0; transform-origin: 0 0; visibility: hidden; display: flex; align-items: center; gap: 8px;
          width: 128px; height: 20px; font-size: 14px; font-weight: 600; letter-spacing: .005em; text-shadow: var(--text-shadow, 0 1px 2px var(--glow)); color: var(--chip-ink); text-transform: var(--case); }
  .chip.eq, .chip.dot { color: var(--chip-on-ink); }
  .chip .name { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chip .mark { width: 11px; height: 12px; flex: none; display: flex; align-items: center; justify-content: center; gap: 1.5px; }
  .chip .mark i { display: block; width: 2.5px; height: 3px; border-radius: 1.5px; background: currentColor; }
  .chip.dot .mark i, .chip.dim .mark i { display: none; }
  .chip.dot .mark i:first-child, .chip.dim .mark i:first-child { display: block; width: 6px; height: 6px; border-radius: 3px; }
  .chip.dim .mark i:first-child { opacity: .55; }
  .chip.off .mark { visibility: hidden; }
  .ctl { position: absolute; left: 0; top: 0; transform-origin: 0 0; visibility: hidden; width: 18px; height: 18px; filter: drop-shadow(0 1px 1.5px rgba(0, 0, 0, .35)); }
  .ctl svg { display: block; width: 18px; height: 18px; fill: var(--btn-ink); }
  .ctl.small, .ctl.small svg { width: 15px; height: 15px; }
  /* performance mode: no blurred shadows behind text */
  body.perf .t, body.perf .chip, body.perf .note { text-shadow: none; }
  body.perf .deco { display: none; }
  body.perf .ctl { filter: none; }
  .deco { position: absolute; left: 0; top: 0; transform-origin: 0 0; visibility: hidden; pointer-events: none; }
  .deco.pixels { image-rendering: pixelated; }
  /* a skin's pictures behind the cards: the player's shell, background particles */
  #under { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  /* "Back to …" under the play/pause button */
  .back { position: absolute; left: 0; top: 0; transform-origin: 0 0; visibility: hidden; display: flex; align-items: center; gap: 8px; width: 138px; height: 30px; color: var(--chip-ink); text-shadow: var(--text-shadow, 0 1px 2px var(--glow)); }
  .back img { width: 30px; height: 30px; border-radius: 7px; object-fit: cover; flex: none; box-shadow: 0 1px 4px rgba(0, 0, 0, .35); }
  .back.noart img { display: none; }
  .back .txt { display: flex; flex-direction: column; min-width: 0; line-height: 1.15; }
  .back .lbl { font-size: 10.5px; font-weight: 500; opacity: .75; text-transform: var(--case); }
  .back .ttl { font-size: 13px; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  body.perf .back { text-shadow: none; }
  body.perf .back img { box-shadow: none; }
  .note { position: absolute; left: 0; top: 0; margin: 0; transform-origin: 0 0; visibility: hidden; width: 136px; text-align: center;
          font-size: 11.5px; font-weight: 500; line-height: 1.3; color: var(--ink); text-shadow: 0 1px 2px rgba(0, 0, 0, .4);
          /* at most two lines inside its frosted backing; a long word or address breaks too */
          overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
</style>
</head>
<body>
<div id="under" aria-hidden="true"></div>
<canvas id="gl"></canvas>
<div id="ui" aria-hidden="true"></div>
<script src="overlay.js"></script>
</body>
</html>
