<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What was I playing?</title>
<script>if (window.__SKIPDAT_MICA) document.documentElement.classList.add('mica');</script>
<style>
  /* "What was I playing?": the songs you listened to, newest first, kept only on this PC.
     Same liquid glass as Settings. */
  :root {
    --ink: #F5F7FB; --ink-soft: rgba(229, 235, 245, .66); --ink-faint: rgba(229, 235, 245, .42);
    --accent: #F6A9CB; --accent-strong: #F27DB2; --accent-ink: #2A0F1E; --warn: #F2B880;
    --rim: rgba(255, 255, 255, .14); --rim-hi: rgba(255, 255, 255, .34);
    --font: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    --display: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { background: #0B1018; }
  html.mica { background: transparent; }
  body { margin: 0; min-height: 100vh; color: var(--ink); font: 14px/1.45 var(--font); -webkit-font-smoothing: antialiased;
    background: radial-gradient(900px 600px at 0% -10%, #1C2540 0%, transparent 60%), radial-gradient(700px 500px at 110% 110%, #2A1733 0%, transparent 60%), linear-gradient(160deg, #0E1422, #0A0E17); }
  html.mica body { background: linear-gradient(180deg, rgba(10, 14, 22, .46), rgba(10, 14, 22, .62)); }
  main { max-width: 620px; margin: 0 auto; padding: 18px 16px 24px; display: grid; gap: 12px; }
  header { display: flex; align-items: center; gap: 12px; }
  h1 { margin: 0; font: 650 22px/1.1 var(--display); letter-spacing: -.01em; flex: 1; }
  header p { margin: 2px 0 0; color: var(--ink-soft); font-size: 13px; }
  button { font: 600 13px var(--font); color: var(--ink); cursor: pointer; border: 0; border-radius: 12px; padding: 8px 14px;
    background: linear-gradient(180deg, rgba(255, 255, 255, .14), rgba(255, 255, 255, .06)); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .22), inset 0 0 0 1px var(--rim); }
  button:hover { background: linear-gradient(180deg, rgba(255, 255, 255, .20), rgba(255, 255, 255, .09)); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .32), inset 0 0 0 1px var(--rim-hi); }
  button.danger { color: #ffd9c2; }
  .list { display: grid; gap: 6px; }
  .day { margin: 10px 4px 2px; font: 600 12px var(--font); letter-spacing: .05em; text-transform: uppercase; color: var(--ink-faint); }
  .song { display: grid; grid-template-columns: 48px minmax(0, 1fr) auto; gap: 12px; align-items: center; width: 100%; text-align: left; padding: 8px 12px 8px 8px; border-radius: 16px;
    background: linear-gradient(180deg, rgba(255, 255, 255, .09), rgba(255, 255, 255, .04)), rgba(16, 22, 34, .5);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .16), inset 0 0 0 1px var(--rim); }
  .song img, .song .noart { width: 48px; height: 48px; border-radius: 10px; object-fit: cover; box-shadow: 0 3px 10px rgba(0, 0, 0, .35); }
  .song .noart { display: grid; place-items: center; background: linear-gradient(135deg, #3b4a66, #1d2433); color: rgba(250, 251, 253, .55); font-size: 20px; }
  .song b { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .song span.meta { display: block; color: var(--ink-soft); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .song .when { color: var(--ink-faint); font-size: 12px; text-align: right; }
  .song .play { display: block; font-size: 12px; color: var(--accent); opacity: 0; transition: opacity .15s; }
  .song:hover .play, .song:focus-visible .play { opacity: 1; }
  .empty { text-align: center; color: var(--ink-soft); padding: 40px 10px; }
  .empty b { display: block; color: var(--ink); font-size: 16px; margin-bottom: 4px; }
  .foot { color: var(--ink-faint); font-size: 12px; text-align: center; margin: 4px 0 0; }
  .status { margin: 0; min-height: 1.4em; color: var(--ink-soft); font-size: 13px; text-align: center; }
  .confirm { display: flex; gap: 8px; align-items: center; justify-content: flex-end; }
  .confirm span { color: var(--ink-soft); font-size: 13px; }
</style>
</head>
<body>
<main>
  <header>
    <div style="flex:1"><h1>What was I playing?</h1><p>Songs you listened to, newest first. Click one to play it again.</p></div>
    <button type="button" class="danger" id="clear">Clear history</button>
  </header>
  <div class="confirm" id="confirm" hidden><span>Clear the whole history?</span><button type="button" class="danger" id="yes">Clear</button><button type="button" id="no">Keep it</button></div>
  <p class="status" id="status" role="status"></p>
  <div class="list" id="list"></div>
  <p class="foot">Kept only on this PC. A song counts once it has played for a few seconds.</p>
</main>
<script>
(() => {
  const T = window.__TAURI__;
  const invoke = (c, a) => T ? T.core.invoke(c, a) : Promise.reject(new Error('Open this from the Skip Dat app.'));
  const artUrl = id => (T && T.core.convertFileSrc ? T.core.convertFileSrc(id, 'skipart') : id);
  const $ = id => document.getElementById(id);
  const say = msg => { $('status').textContent = msg || ''; };
  function ago(secs) {
    const d = Math.max(0, Date.now() / 1000 - secs);
    if (d < 60) return 'just now';
    if (d < 3600) return Math.round(d / 60) + ' min ago';
    if (d < 86400) return Math.round(d / 3600) + ' h ago';
    return new Date(secs * 1000).toLocaleDateString(undefined, { day: 'numeric', month: 'short' });
  }
  function dayOf(secs) {
    const d = new Date(secs * 1000), today = new Date();
    const y = new Date(); y.setDate(today.getDate() - 1);
    if (d.toDateString() === today.toDateString()) return 'Today';
    if (d.toDateString() === y.toDateString()) return 'Yesterday';
    return d.toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'long' });
  }
  async function load() {
    let list = [];
    try { list = await invoke('history_list'); } catch (e) { say(String(e)); }
    const box = $('list');
    box.textContent = '';
    $('clear').hidden = !list.length;
    if (!list.length) {
      const e = document.createElement('div'); e.className = 'empty';
      e.innerHTML = '<b>Nothing yet</b>Songs you listen to show up here.';
      box.append(e);
      return;
    }
    let lastDay = '';
    for (const s of list) {
      const day = dayOf(s.time);
      if (day !== lastDay) { const h = document.createElement('div'); h.className = 'day'; h.textContent = day; box.append(h); lastDay = day; }
      const b = document.createElement('button'); b.type = 'button'; b.className = 'song';
      let pic;
      if (s.art) { pic = document.createElement('img'); pic.alt = ''; pic.loading = 'lazy'; pic.src = artUrl(s.art); pic.onerror = () => pic.replaceWith(noArt()); }
      else pic = noArt();
      const mid = document.createElement('span');
      const t = document.createElement('b'); t.textContent = s.title;
      const m = document.createElement('span'); m.className = 'meta';
      m.textContent = [s.artist, s.via ? s.app + ' in ' + s.via : s.app].filter(Boolean).join(' · ');
      mid.append(t, m);
      const when = document.createElement('span'); when.className = 'when';
      when.textContent = ago(s.time);
      const play = document.createElement('span'); play.className = 'play'; play.textContent = 'Play again';
      when.append(play);
      b.append(pic, mid, when);
      b.addEventListener('click', async () => {
        try { await invoke('history_play', { id: s.id }); say('Playing ' + s.title + '…'); } catch (e) { say(String(e)); }
      });
      box.append(b);
    }
  }
  function noArt() { const d = document.createElement('span'); d.className = 'noart'; d.textContent = '♪'; return d; }
  $('clear').addEventListener('click', () => { $('confirm').hidden = false; });
  $('no').addEventListener('click', () => { $('confirm').hidden = true; });
  $('yes').addEventListener('click', async () => {
    $('confirm').hidden = true;
    try { await invoke('history_clear'); say('History cleared.'); } catch (e) { say(String(e)); }
    load();
  });
  if (T) T.event.listen('lg-history', () => load());
  load();
  setInterval(() => document.querySelectorAll('.when').length && load(), 60000);
})();
</script>
</body>
</html>
